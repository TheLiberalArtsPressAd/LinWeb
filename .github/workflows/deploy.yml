name: Deploy Godot Web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # GitHub Pages serves the files verbatim; it does not resolve Git LFS.
      # If the LFS download did not materialise the engine files the site would
      # show the raw pointer text ("version https://git-lfs.github.com/...")
      # and freeze on a blank loading screen, so fail loudly instead.
      - name: Verify engine files are real (not LFS pointers)
        run: |
          set -eu
          for f in index.html index.js index.wasm index.pck stream-cache-sw.js; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::missing from the deployment"
              exit 1
            fi
            if head -c 100 "$f" | grep -q "git-lfs.github.com"; then
              echo "::error file=$f::still a Git LFS pointer, Pages cannot serve it"
              exit 1
            fi
          done
          ls -l index.pck index.wasm

      # The published site is assembled explicitly instead of uploading the
      # repository root: mapdata/*.zip holds ~570 MB of per-map stream data
      # (manifests, downscaled page tiles, previews) that must not be published
      # as downloads, and the repository also carries tooling that has no
      # business being on the site.
      - name: Assemble site
        run: |
          set -eu
          # The published site must stay under the GitHub Pages 1 GB cap. The two
          # engine binaries are ~305 MB uncompressed (249 MB trimmed pack plus
          # 56 MB wasm) but only ~161 MB gzipped (~147 MB plus ~14 MB), so ship
          # them as .gz and let index.html's fetch shim decompress them.
          gzip -9 -c index.pck > index.pck.gz
          gzip -9 -c index.wasm > index.wasm.gz
          ls -l index.pck.gz index.wasm.gz

          mkdir -p _site
          cp -a index.html index.js index.pck.gz index.wasm.gz \
                index.png index.icon.png index.apple-touch-icon.png \
                index.audio.worklet.js index.audio.position.worklet.js \
                stream-cache-sw.js coi-serviceworker.js clear.html .nojekyll _site/
          # Keep the plain names present but tiny: the Pages artifact linter and
          # the shim's no-.gz fallback both reference them.
          printf 'placeholder: the browser fetches index.pck.gz\n' > _site/index.pck
          printf 'placeholder: the browser fetches index.wasm.gz\n' > _site/index.wasm

          mkdir -p _site/stream
          cp -a stream/. _site/stream/
          # Info-ZIP converts entry names from the archive's charset to the process
          # charset, and the runner's locale is not UTF-8, so it replaced every
          # non-ASCII byte with '?': the 165 Chinese-named area backgrounds landed
          # as "?жЦ??...jpg" and 404'd, which is what made 奇岩 render gray. Python's
          # zipfile honours the UTF-8 flag and writes the stored names verbatim.
          python3 - <<'PY'
          import glob
          import zipfile

          for archive in sorted(glob.glob('mapdata/*.zip')):
              with zipfile.ZipFile(archive) as z:
                  z.extractall('_site/stream')

          # A mangled name is never valid here, so fail loudly instead of
          # deploying art the client will 404 on.
          bad = [p for p in glob.glob('_site/stream/**/*', recursive=True) if '?' in p]
          if bad:
              raise SystemExit(f'{len(bad)} mangled stream paths, e.g. {bad[0]}')
          PY
          ls _site/stream/maps | wc -l
          ls _site/stream/area/1920x1080 | wc -l

          # WebAssetCache asks for <name>.gz first for every streamed .json/.bin
          # (terrain/occlusion grids, map metadata, atlas JSON). mapdata/maps-99.zip
          # carries those gzip members; drop the uncompressed originals so the
          # published site stays under the 1 GB cap. Files without a .gz sibling
          # are left untouched and still load through the plain-name fallback.
          find _site/stream -type f \( -name '*.json' -o -name '*.bin' \) -print0 |
            while IFS= read -r -d '' f; do
              if [ -f "$f.gz" ]; then rm -f "$f"; fi
            done

          bytes=$(du -sb _site | cut -f1)
          echo "site size: $bytes bytes ($((bytes / 1024 / 1024)) MiB)"
          du -sh _site
          if [ "$bytes" -ge 1000000000 ]; then
            echo "::error::_site is $bytes bytes, over the 1 GB GitHub Pages limit"
            exit 1
          fi
          # Leave a visible warning well before the hard cap: the stream tree is
          # ~977 MB (du counts directory entries too), so a single large
          # re-export can cross the limit unnoticed.
          if [ "$bytes" -ge 985000000 ]; then
            echo "::warning::_site is $bytes bytes, within 15 MB of the 1 GB Pages limit"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # While the repository still uses "Deploy from a branch" as its Pages
      # source, GitHub additionally runs the legacy "pages build and deployment"
      # workflow on every push. That build publishes the raw branch, i.e. the
      # Git LFS pointer files; whichever deployment lands last wins, so a legacy
      # build finishing after ours makes the site serve 131-byte pointers and
      # freeze on a blank loading screen. Wait for it (a no-op once the source is
      # set to "GitHub Actions"), so this artifact is always the newest
      # deployment.
      - name: Wait for the legacy branch deployment to finish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          for attempt in $(seq 1 40); do
            pending=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
              --limit 50 --json name,status \
              --jq '[.[] | select(.name == "pages build and deployment" and .status != "completed")] | length')
            if [ "$pending" = "0" ]; then
              echo "legacy Pages build already finished"
              exit 0
            fi
            echo "attempt $attempt: waiting for the legacy Pages build"
            sleep 15
          done
          echo "::warning::legacy Pages build did not finish in time; deploying anyway"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
