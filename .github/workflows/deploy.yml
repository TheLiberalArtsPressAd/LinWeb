name: Deploy Godot Web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # GitHub Pages serves the files verbatim; it does not resolve Git LFS.
      # If the LFS download did not materialise the engine files the site would
      # show the raw pointer text ("version https://git-lfs.github.com/...")
      # and freeze on a blank loading screen, so fail loudly instead.
      - name: Verify engine files are real (not LFS pointers)
        run: |
          set -eu
          for f in index.html index.js index.wasm index.pck stream-cache-sw.js; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::missing from the deployment"
              exit 1
            fi
            if head -c 100 "$f" | grep -q "git-lfs.github.com"; then
              echo "::error file=$f::still a Git LFS pointer, Pages cannot serve it"
              exit 1
            fi
          done
          ls -l index.pck index.wasm

      # stream-lod/ holds the reduced-size page tiles generated for the web
      # build. Static hosts cannot run serve_web.py's on-the-fly LOD
      # conversion, so expose them under the paths the client actually
      # requests (stream/maps/<key>/pages/*.webp).
      - name: Overlay reduced-size stream pages
        run: |
          if [ -d stream-lod ]; then
            cp -a stream-lod/. stream/
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # While the repository still uses "Deploy from a branch" as its Pages
      # source, GitHub additionally runs the legacy "pages build and deployment"
      # workflow on every push. That build publishes the raw branch, i.e. the
      # Git LFS pointer files, and it takes longer than this workflow — if it
      # lands after our deployment the site serves 131-byte pointers and freezes
      # on a blank loading screen. Wait for it (a no-op once the source is set to
      # "GitHub Actions"), so this artifact is always the newest deployment.
      - name: Wait for the legacy branch deployment to finish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          for attempt in $(seq 1 40); do
            pending=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
              --limit 50 --json name,status \
              --jq '[.[] | select(.name == "pages build and deployment" and .status != "completed")] | length')
            if [ "$pending" = "0" ]; then
              echo "legacy Pages build already finished"
              exit 0
            fi
            echo "attempt $attempt: waiting for the legacy Pages build"
            sleep 15
          done
          echo "::warning::legacy Pages build did not finish in time; deploying anyway"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
