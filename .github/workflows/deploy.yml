name: Deploy Godot Web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # GitHub Pages serves the files verbatim; it does not resolve Git LFS.
      # If the LFS download did not materialise the engine files the site would
      # show the raw pointer text ("version https://git-lfs.github.com/...")
      # and freeze on a blank loading screen, so fail loudly instead.
      - name: Verify engine files are real (not LFS pointers)
        run: |
          set -eu
          for f in index.html index.js index.wasm index.pck stream-cache-sw.js; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::missing from the deployment"
              exit 1
            fi
            if head -c 100 "$f" | grep -q "git-lfs.github.com"; then
              echo "::error file=$f::still a Git LFS pointer, Pages cannot serve it"
              exit 1
            fi
          done
          ls -l index.pck index.wasm

      # The published site is assembled explicitly instead of uploading the
      # repository root: mapdata/*.zip holds ~570 MB of per-map stream data
      # (manifests, downscaled page tiles, previews) that must not be published
      # as downloads, and the repository also carries tooling that has no
      # business being on the site.
      - name: Assemble site
        run: |
          set -eu
          mkdir -p _site
          cp -a index.html index.js index.pck index.wasm \
                index.png index.icon.png index.apple-touch-icon.png \
                index.audio.worklet.js index.audio.position.worklet.js \
                stream-cache-sw.js coi-serviceworker.js clear.html .nojekyll _site/
          mkdir -p _site/stream
          cp -a stream/. _site/stream/
          for archive in mapdata/*.zip; do
            unzip -q -o "$archive" -d _site/stream
          done
          ls _site/stream/maps | wc -l
          du -sh _site

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # While the repository still uses "Deploy from a branch" as its Pages
      # source, GitHub additionally runs the legacy "pages build and deployment"
      # workflow on every push. That build publishes the raw branch, i.e. the
      # Git LFS pointer files; whichever deployment lands last wins, so a legacy
      # build finishing after ours makes the site serve 131-byte pointers and
      # freeze on a blank loading screen. Wait for it (a no-op once the source is
      # set to "GitHub Actions"), so this artifact is always the newest
      # deployment.
      - name: Wait for the legacy branch deployment to finish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          for attempt in $(seq 1 40); do
            pending=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
              --limit 50 --json name,status \
              --jq '[.[] | select(.name == "pages build and deployment" and .status != "completed")] | length')
            if [ "$pending" = "0" ]; then
              echo "legacy Pages build already finished"
              exit 0
            fi
            echo "attempt $attempt: waiting for the legacy Pages build"
            sleep 15
          done
          echo "::warning::legacy Pages build did not finish in time; deploying anyway"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
