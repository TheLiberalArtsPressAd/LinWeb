<script>
/*
 * GitHub Pages keeps the engine binaries gzip-compressed (index.pck.gz /
 * index.wasm.gz) so the published site stays under the 1 GB cap. The deploy
 * workflow writes those members and leaves tiny placeholders at the plain
 * names. Redirect the engine's normal requests to the .gz members and decode
 * them in the browser; when no .gz is deployed (local dev, serve_web.py) this
 * silently falls back to the uncompressed file.
 */
(function () {
	if (typeof DecompressionStream === 'undefined') {
		console.warn('[size] DecompressionStream unavailable; using uncompressed engine files.');
		return;
	}
	var originalFetch = window.fetch.bind(window);
	window.fetch = function (resource, init) {
		var url = typeof resource === 'string' ? resource : (resource && resource.url) || '';
		if (!/\.(?:wasm|pck)(?:[?#]|$)/i.test(url)) return originalFetch(resource, init);
		var u = new URL(url, location.href);
		if (/\.gz$/i.test(u.pathname)) return originalFetch(resource, init);
		u.pathname += '.gz';
		return originalFetch(u.toString(), init).then(function (gz) {
			if (!gz.ok) return originalFetch(resource, init);
			var headers = new Headers(gz.headers);
			headers.set('Content-Type', /\.wasm\.gz$/i.test(u.pathname) ? 'application/wasm' : 'application/octet-stream');
			headers.delete('Content-Encoding');
			headers.delete('Content-Length');
			var encoding = (gz.headers.get('content-encoding') || '').toLowerCase();
			var body = encoding === 'gzip' ? gz.body : gz.body.pipeThrough(new DecompressionStream('gzip'));
			return new Response(body, { status: gz.status, statusText: gz.statusText, headers: headers });
		}).catch(function () {
			return originalFetch(resource, init);
		});
	};
})();
</script>

<script>
(function () {
	var MAX_EVENTS = 40;
	var events = 0;
	function note(text) {
		if (events++ >= MAX_EVENTS) return;
		try { console.error('[Freeze] ' + text); } catch (e) {}
	}
	function nowMs() {
		return (window.performance && performance.now) ? performance.now() : Date.now();
	}
	var last = nowMs();
	setInterval(function () {
		var now = nowMs();
		var gap = now - last;
		last = now;
		if (gap < 1000 || gap > 60000) return;
		if (document.visibilityState === 'hidden') return;
		note('js-gap=' + Math.round(gap) + 'ms');
	}, 250);

	var canvas = document.getElementById('canvas');
	if (!canvas) return;
	canvas.addEventListener('webglcontextlost', function () {
		note('webgl-context-lost');
		showContextLost();
	}, false);
	canvas.addEventListener('webglcontextrestored', function () {
		note('webgl-context-restored');
	}, false);

	function showContextLost() {
		if (document.getElementById('gl-lost')) return;
		var box = document.createElement('div');
		box.id = 'gl-lost';
		box.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:rgba(8,10,14,.92);color:#e6edf3;font:14px/1.6 system-ui,sans-serif;text-align:center;padding:24px;';
		box.innerHTML = '<div><div style="font-size:18px;font-weight:600;margin-bottom:8px">畫面已停止更新</div>'
			+ '<div style="color:#9fb0c3;margin-bottom:14px">顯示卡資源不足或驅動程式重設了 WebGL 內容，遊戲需要重新載入。</div>'
			+ '<button id="gl-reload" style="font:inherit;padding:8px 18px;border-radius:6px;border:1px solid #3b4a5c;background:#1f6feb;color:#fff;cursor:pointer">重新載入</button></div>';
		document.body.appendChild(box);
		var btn = document.getElementById('gl-reload');
		if (btn) btn.onclick = function () { window.location.reload(); };
	}
})();
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":248834228,"index.wasm":56194770},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else if (!window.crossOriginIsolated) {
		// Godot's WASM build transfers SharedArrayBuffers to its worker pool, so
		// the page must be crossOriginIsolated (COOP/COEP). GitHub Pages and
		// other static hosts cannot send those headers; stream-cache-sw.js
		// injects them, and we reload once the worker controls this document.
		// Without this the download reaches 100% and the page then freezes with
		// "SharedArrayBuffer transfer requires self.crossOriginIsolated".
		const coiKey = 'il_coi_reloads';
		const coiReloads = parseInt(sessionStorage.getItem(coiKey) || '0', 10);
		if ('serviceWorker' in navigator && coiReloads < 2) {
			sessionStorage.setItem(coiKey, String(coiReloads + 1));
			setStatusMode('notice');
			setStatusNotice('正在啟用跨源隔離（Service Worker）…\n完成後會自動重新整理。');
			navigator.serviceWorker.register('stream-cache-sw.js').then(function (registration) {
				if (navigator.serviceWorker.controller || registration.active) {
					window.location.reload();
					return;
				}
				navigator.serviceWorker.addEventListener('controllerchange', function () {
					window.location.reload();
				});
				window.setTimeout(function () {
					window.location.reload();
				}, 4000);
			}, function (err) {
				displayFailureNotice('無法啟用跨源隔離：' + err.message);
			});
		} else {
			displayFailureNotice('此瀏覽器無法提供 crossOriginIsolated（COOP/COEP），因此無法執行 WebAssembly 版本。\n請改用 Chrome / Edge，並確認 Service Worker 未被停用。');
		}
	} else {
		sessionStorage.removeItem('il_coi_reloads');
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
